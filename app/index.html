<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JoachimKantola PT</title>
<link rel="manifest" href="manifest.webmanifest">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JK PT">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Theme follows the JoachimKantola PT logo: black, lime #b6f700, white. Always dark.
   VOICE everyday tool, gym floor: direct, sturdy, quick to tap between sets
   IDEA a loaded barbell and bumper plates; each workout this week adds a plate
   PICTURE barbell on the Today screen, plates coloured by workout kind
   COLOUR white or near-black ground, bumper red lead, blue, yellow (PR), green (done)
   TYPE Barlow Condensed 700 for titles and numbers + Barlow
   LAYOUT one-screen app: header, scrolling view, rest bar, tab bar; max 720px */
:root{color-scheme:dark;--acc:#b6f700;--on-acc:#0a0a0a;--teal:#2ec4b6;--vio:#a58bff;--bg:light-dark(#0a0a0a,#0a0a0a);--card:light-dark(#18191a,#18191a);--line:light-dark(#2e3032,#2e3032);--ink:light-dark(#f4f5f0,#f4f5f0);--mut:light-dark(#a3a69c,#a3a69c);--red:#e0322b;--blue:light-dark(#1d5fd6,#4d8df5);--yel:#f2c200;--grn:#b6f700;--org:light-dark(#e8730c,#ff9a3d);--steel:light-dark(#9ea3aa,#6d727a)}
:root[data-theme=light]{color-scheme:dark}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));max-width:720px;width:100%;margin:0 auto}
h1{font:700 clamp(34px,9vw,46px)/1.05 "Barlow Condensed",sans-serif;margin:0;letter-spacing:-.01em}
h2{font:700 26px/1.1 "Barlow Condensed",sans-serif;margin:26px 0 10px}
h3{font:700 21px/1.1 "Barlow Condensed",sans-serif;margin:0}
.top>div{display:flex;align-items:center;gap:12px}
.logo{width:54px;height:54px;flex:none;display:block}
.sync{font-size:13px;color:var(--mut);text-align:right;padding-bottom:6px}
.sync.err{color:var(--red)}
#scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
main{max-width:720px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.mut{color:var(--mut)}
.sm{font-size:14px}
.card{background:var(--card);border-radius:16px;padding:14px}
.stack>*+*{margin-top:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 16px;font:600 16px Barlow,sans-serif;background:var(--card);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.card .btn{background:var(--bg)}
.btn.pri{background:var(--acc);color:var(--on-acc);font-weight:700}
.btn.big{width:100%;min-height:56px;font-size:19px;border-radius:14px}
.btn.txt{background:none;color:var(--mut);padding:0 8px}
.btn.on{background:var(--ink);color:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
input,select,textarea{font:500 16px Barlow,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:110px;font-size:14px}
.bell{display:block;width:100%;height:auto;max-height:150px;margin:6px 0 2px}
.bellcap{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.big-n{font:700 clamp(30px,8vw,38px)/1 "Barlow Condensed",sans-serif;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:12px 0 4px}
.wd{background:var(--card);border-radius:12px;padding:8px 2px 9px;text-align:center;font-size:13px;line-height:1.2;border:2px solid transparent}
.wd.now{border-color:var(--ink)}
.wd b{display:block;font-weight:700;font-size:14px}
.wd i{display:block;font-style:normal;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px;margin-top:2px}
.dot{display:block;width:16px;height:16px;border-radius:50%;margin:6px auto 0;border:2px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stats div{background:var(--card);border-radius:14px;padding:12px}
.stats span{display:block;font-size:13px;color:var(--mut);margin-top:4px}
.today{margin-top:14px;border-left:6px solid var(--acc)}
.lbl{font-size:14px;color:var(--mut);font-weight:600}
.exl{list-style:none;margin:10px 0 14px;padding:0}
.exl li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.exl li span:last-child{color:var(--mut);text-align:right;white-space:nowrap;font-size:15px}
.ex{margin-top:12px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.setrow{display:grid;grid-template-columns:26px minmax(0,1fr) minmax(0,1fr) 52px 36px;gap:8px;align-items:center;margin-top:8px}
.setrow.hd{font-size:13px;color:var(--mut);margin-top:12px;text-align:center}
.setrow input{text-align:center;font:600 19px Barlow,sans-serif;padding:6px}
.setrow .wide{grid-column:span 2}
.setrow .n{font:700 18px "Barlow Condensed",sans-serif;text-align:center;position:relative}
.chk{width:52px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:transparent;cursor:pointer;display:grid;place-items:center}
.done .chk{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.done input{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 12%,var(--bg))}
.x{width:36px;height:44px;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;border-radius:10px}
.pr{display:inline-block;background:var(--yel);color:#111;font:700 12px Barlow,sans-serif;border-radius:6px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.setrow .pr{position:absolute;left:-4px;top:-14px;margin:0}
.daycard{margin-top:10px}
.daycard .dh{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center}
.daycard .dn{font:700 20px "Barlow Condensed",sans-serif}
.pl{list-style:none;margin:8px 0 0;padding:0}
.pl li{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);padding:2px 0 2px 2px}
.pl li span{flex:1}
details.card{margin-top:10px}
summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
summary::-webkit-details-marker{display:none}
.hist-meta{font-size:14px;color:var(--mut);white-space:nowrap}
.hitem{padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.rec{width:100%;border-collapse:collapse}
.rec td{padding:10px 4px;border-top:1px solid var(--line);vertical-align:top}
.rec td:nth-child(2){text-align:right;white-space:nowrap;font-weight:600}
.rec td:nth-child(3){text-align:right;white-space:nowrap;color:var(--mut);font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips .btn{flex:none;min-height:38px;padding:0 13px;font-size:15px}
.libi summary{padding:2px 0}
.tag{font-size:13px;color:var(--mut);white-space:nowrap}
.empty{text-align:center;padding:30px 16px;color:var(--mut)}
#rest{display:none;background:var(--ink);color:var(--bg);position:relative;overflow:hidden}
#rest.show{display:block}
#rest .fill{position:absolute;inset:0 auto 0 0;background:var(--acc);opacity:1;transition:width .25s linear}
#rest .in{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:720px;margin:0 auto;padding:8px 16px}
#rest .t{font:700 30px/1 "Barlow Condensed",sans-serif;white-space:nowrap}
#rest .btn{background:rgba(0,0,0,.12);color:inherit;min-height:40px;padding:0 12px}
:root:not([data-theme=light]) #rest .btn{background:rgba(0,0,0,.12)}
.ss{border-left:6px solid var(--blue)}
.sslbl{color:var(--blue);font-weight:700;font-size:13px}
.pl li.ssl{border-left:4px solid var(--blue);padding-left:8px}
.lkb{color:var(--mut)}
.lkb.on{color:var(--blue)}
.eff{display:flex;gap:6px;align-items:center;margin:6px 0 2px 34px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.eff button{min-width:42px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px Barlow,sans-serif;cursor:pointer}
.eff button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.th{width:60px;height:42px;border-radius:8px;object-fit:cover;flex:none;background:#fff;display:inline-grid;place-items:center}
.th.ph{background:color-mix(in srgb,var(--ink) 10%,var(--card));color:var(--mut);font:700 18px "Barlow Condensed",sans-serif}
.lrow{display:flex;gap:12px;align-items:center}
.thb{border:0;padding:0;background:none;cursor:pointer;border-radius:8px;margin-right:10px;align-self:flex-start}
.demo{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#fff;max-width:480px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo .b{animation:flip 2.4s steps(1,end) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.tips{margin:10px 0 0;padding-left:22px}
.tips li{margin:3px 0}
.chipw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 12px;max-height:230px;overflow-y:auto}
.chipw .btn{min-height:40px;padding:0 12px;font-size:15px}
.calh{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;margin:4px 0 12px}
.calh .btn{font-size:24px;width:48px;padding:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wdh{font-size:12px;color:var(--mut);text-align:center;padding:2px 0 4px}
.cd{min-height:50px;border:0;border-radius:10px;background:var(--card);color:var(--ink);display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;gap:5px;font:600 16px Barlow,sans-serif;cursor:pointer}
.cd.out{opacity:.35}
.cd.now{box-shadow:inset 0 0 0 2px var(--ink)}
.cd.sel{background:var(--acc);color:var(--on-acc)}
.cd i{display:flex;gap:3px;justify-content:center;min-height:8px}
.cd b{width:8px;height:8px;border-radius:50%}
.cd b.pl{background:none;box-shadow:inset 0 0 0 1.5px var(--mut)}
.cd.sel b{box-shadow:0 0 0 1.5px var(--on-acc)}
.cd.sel b.pl{box-shadow:inset 0 0 0 1.5px var(--on-acc)}
.tname{font:700 15px Barlow,sans-serif;color:var(--acc);margin:-2px 0 10px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:none;color:var(--mut);font:600 15px Barlow,sans-serif;cursor:pointer;padding:0 4px}
.seg button.on{background:var(--acc);color:var(--on-acc)}
.seg.sm2{margin-top:2px}
.nextc{margin-top:14px;border-left:6px solid var(--acc)}
.tl{margin:12px 0 14px;border-left:2px solid var(--line);padding-left:12px}
.tl div{display:flex;gap:12px;padding:4px 0}
.tl b{font:700 18px "Barlow Condensed",sans-serif;min-width:3em;white-space:nowrap}
.tl em{font-style:normal;color:var(--acc);font-weight:600}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;color:var(--ink);padding:10px 0;font:inherit;cursor:pointer}
.srow:first-child{border-top:0}
.sd{display:flex;flex-direction:column;align-items:center;line-height:1;font-size:13px;color:var(--mut)}
.sd b{font:700 26px "Barlow Condensed",sans-serif;color:var(--ink)}
.si{display:flex;flex-direction:column}
.tagc{font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--acc);color:var(--on-acc);white-space:nowrap;align-self:center}
.tagc.m{background:#fff}
.chkl{list-style:none;margin:0;padding:0}
.chkl li{padding:7px 0 7px 28px;position:relative;border-top:1px solid var(--line)}
.chkl li:first-child{border-top:0}
.chkl li::before{content:"";position:absolute;left:3px;top:14px;width:13px;height:7px;border-left:3px solid var(--acc);border-bottom:3px solid var(--acc);transform:rotate(-45deg)}
.blk{margin-top:10px}
.bh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.bt{font:700 22px "Barlow Condensed",sans-serif;color:var(--acc);white-space:nowrap}
.bm{white-space:nowrap;min-width:4em;text-align:center}
.mdr{display:grid;grid-template-columns:84px minmax(0,1fr) 36px 36px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.mdr .dimg{aspect-ratio:16/9;border-radius:8px}
.dimg{display:block;width:100%;aspect-ratio:4/1.1;object-fit:cover;object-position:center 70%;border-radius:12px;background:#1d2a3a}
.dimg.ph{display:grid;place-items:center;color:var(--mut);font:700 18px "Barlow Condensed",sans-serif}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px;margin-top:8px}
.dcard{display:flex;flex-direction:column;gap:8px}
.dh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-top:4px}
.dh h3{font-size:24px}
.dcard .tips{margin:0}
.df{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.pts{font:700 18px "Barlow Condensed",sans-serif;color:var(--acc);white-space:nowrap}
.eqs{display:flex;flex-wrap:wrap;gap:6px}
.eqs span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600}
.att{display:flex;flex-wrap:wrap;gap:6px}
.att button{min-height:40px;border-radius:20px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 15px Barlow,sans-serif;padding:0 14px;cursor:pointer}
.att button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.lnk{border:0;background:none;color:var(--acc);font:inherit;text-decoration:underline;padding:0;cursor:pointer}
.res{display:grid;grid-template-columns:minmax(0,1fr) 56px auto 56px minmax(0,1fr);gap:8px;align-items:center;font-weight:600}
.res input{text-align:center;font:700 26px "Barlow Condensed",sans-serif;padding:4px}
.res span:last-child{text-align:right}
.lead2{font:700 22px "Barlow Condensed",sans-serif;text-align:center;margin:14px 0 10px}
.teams{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.team{border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.team.ta{background:#1f8f3a;color:#fff}
.team.tb{background:#f5c400;color:#111}
.team input{background:rgba(0,0,0,.18);border:0;color:inherit;font:700 18px "Barlow Condensed",sans-serif;text-align:center}
.team.tb input{background:rgba(0,0,0,.1)}
.tp{font:800 clamp(64px,22vw,110px)/1 "Barlow Condensed",sans-serif;text-align:center}
.tq{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tq2{display:grid;gap:6px}
.team .btn{background:rgba(0,0,0,.2);color:inherit;min-height:44px;padding:0 6px;font-size:15px}
.team.tb .btn{background:rgba(0,0,0,.12)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto 36px;gap:8px;align-items:center;border-top:1px solid var(--line);padding:4px 0}
.prow:first-child{border-top:0}
.tcard{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;border:0;margin-top:12px;color:var(--ink);font:inherit;cursor:pointer;border-left:6px solid #fff}
.cd b.tm{background:#fff;border-radius:2px}
.tabs button{font-size:12px}
.logob{border:0;background:none;padding:0;cursor:pointer;border-radius:50%;flex:none}
.who{display:flex;align-items:center;gap:8px;border:0;background:var(--card);color:var(--ink);border-radius:24px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;max-width:52%;text-align:left}
.wt{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.wt b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wt .sync{font-size:11px;padding:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 17px "Barlow Condensed",sans-serif;background:var(--line);color:var(--mut)}
.av.on{background:var(--acc);color:var(--on-acc)}
.signed{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px}
.signed .av{width:46px;height:46px;font-size:22px}
.tsel{font:700 17px Barlow,sans-serif;color:var(--acc);margin:-2px 0 10px;background:var(--card)}
.code{font:800 26px "Barlow Condensed",sans-serif;letter-spacing:.12em;color:var(--acc)}
.auth{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 36px) 20px 40px}
.auth[hidden]{display:none}
.ain{width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.ain h1{font-size:40px}
.alogo{width:150px;height:150px;align-self:center}
.pf1{display:flex;flex-direction:column;gap:6px;font-weight:600}
.amsg{color:var(--acc);min-height:1.3em;margin:0;font-weight:600}
body.locked #app{visibility:hidden}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.imr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,11em);gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.btn[disabled]{opacity:.5}
.pf{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,11em);gap:10px;align-items:center;font-weight:600}
.pf input{text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpis span{display:block;font-size:13px;color:var(--mut);margin-top:3px}
.kpis .big-n{font-size:clamp(24px,6.5vw,32px)}
.fig{position:relative;height:220px;margin:12px 0}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.fig text{paint-order:stroke;stroke:var(--card);stroke-width:4px;font:13px Barlow,sans-serif}
.nowrap{flex-wrap:nowrap}
.nowrap input{flex:1}
.nowrap .btn{flex:none}
.heat{display:grid;grid-template-rows:repeat(7,auto);grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;margin:12px 0 10px}
.heat i{aspect-ratio:1;border-radius:3px;background:color-mix(in srgb,var(--ink) 9%,var(--card))}
.heat i.fut{background:none}
.heat i.now{outline:2px solid var(--ink);outline-offset:-1px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.legend b{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.bars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 10px;align-items:center;margin-top:6px}
.bars .tr{height:14px;border-radius:7px;background:color-mix(in srgb,var(--ink) 8%,var(--card))}
.bars .tr div{height:100%;border-radius:7px;background:var(--acc)}
.bars span:last-child,.bars .v{text-align:right;font-weight:600;white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0px)}

const dispName=()=>{if(!ME)return '';const n=(PROF&&PROF.name)||(ME.email||'').split('@')[0];const em=(ME.email||'').split('@')[0];const base=n&&n!==em?n:em.split(/[._-]/)[0];return base?base.charAt(0).toUpperCase()+base.slice(1):''};
function showWho(){const n=dispName();$('#whoN').textContent=ME?n:'Inte inloggad';$('#av').textContent=ME?(n[0]||'?').toUpperCase():'?';$('#av').classList.toggle('on',!!ME)}
const UK=k=>'jk.'+(ME?ME.id:'anon')+'.'+k;

const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function lsSave(){if(!ME){lsSet(K1,S);lsSet(K2,H);return}lsSet(UK('state'),S);lsSet(UK('sessions'),H);lsSet(UK('pend'),PEND);lsSet(UK('sync'),{lastState,lastTeam,lastTS,TID})}
function save(){lsSave();clearTimeout(fT);fT=setTimeout(flush,700)}
function putSession(s){if(!PEND.w.includes(s.id))PEND.w.push(s.id);PEND.wd=PEND.wd.filter(x=>x!==s.id);save()}
function delSession(id){H=H.filter(s=>s.id!==id);PEND.w=PEND.w.filter(x=>x!==id);if(!PEND.wd.includes(id))PEND.wd.push(id);save()}
const stateOut=()=>{const o=JSON.parse(JSON.stringify(S));delete o.team;delete o._legacyTeam;return o};
const teamBlob=t=>({players:t.players||[],drills:t.drills||[],score:t.score||{a:{n:'Lag Grön',p:0},b:{n:'Lag Gul',p:0}}});
const ck=e=>{if(e&&e.error)throw e.error;return e};
async function flush(){
  if(!sb||!ME)return;if(writing){dirty=true;return}writing=true;
  try{
    const st=JSON.stringify(stateOut());
    if(st!==lastState){ck(await sb.from('user_state').upsert({user_id:ME.id,data:JSON.parse(st),updated_at:new Date().toISOString()}));lastState=st}
    const ws=PEND.w.map(id=>H.find(s=>s.id===id)).filter(Boolean);
    if(ws.length){ck(await sb.from('workouts').upsert(ws.map(s=>({user_id:ME.id,id:s.id,date:s.date,data:s,updated_at:new Date().toISOString()}))));PEND.w=PEND.w.filter(id=>!ws.some(s=>s.id===id))}
    if(PEND.wd.length){const d=PEND.wd.slice();ck(await sb.from('workouts').delete().eq('user_id',ME.id).in('id',d));PEND.wd=PEND.wd.filter(x=>!d.includes(x))}
    if(TID&&S.team)await teamFlush();
    setSync('ok');
  }catch(e){console.warn(e);setSync(navigator.onLine===false?'off':'err')}
  writing=false;lsSave();
  if(dirty){dirty=false;flush()}
}
const teamDirty=()=>{const t=S.team;if(!TID||!t)return false;if(JSON.stringify({n:t.name,b:teamBlob(t)})!==lastTeam)return true;const cur=new Set();for(const s of t.sessions){cur.add(s.id);if(lastTS[s.id]!==JSON.stringify(s))return true}return Object.keys(lastTS).some(id=>!cur.has(id))};
async function teamFlush(){
  const t=S.team,tb=JSON.stringify({n:t.name,b:teamBlob(t)});
  if(tb!==lastTeam){ck(await sb.from('teams').update({name:t.name,data:teamBlob(t),updated_at:new Date().toISOString()}).eq('id',TID));lastTeam=tb}
  const up=[],cur=new Set();
  for(const s of t.sessions){cur.add(s.id);const j=JSON.stringify(s);if(lastTS[s.id]!==j)up.push(s)}
  if(up.length){ck(await sb.from('team_sessions').upsert(up.map(s=>({team_id:TID,id:s.id,date:s.date,data:s,updated_at:new Date().toISOString(),updated_by:ME.id}))));up.forEach(s=>lastTS[s.id]=JSON.stringify(s))}
  const gone=Object.keys(lastTS).filter(id=>!cur.has(id));
  if(gone.length){ck(await sb.from('team_sessions').delete().eq('team_id',TID).in('id',gone));gone.forEach(id=>delete lastTS[id])}
}
const busyUI=()=>{const a=document.activeElement;return !$('#sheet').hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))};
async function teamPull(force){
  if(!sb||!TID)return;if(!force&&(writing||teamDirty()))return;
  try{
    const [tr,sr]=await Promise.all([sb.from('teams').select('id,name,join_code,owner,data').eq('id',TID).maybeSingle(),sb.from('team_sessions').select('id,data').eq('team_id',TID)]);
    ck(tr);ck(sr);if(!tr.data){TID=null;S.team=null;render();return}
    if(!force&&teamDirty())return;
    const d=tr.data.data||{};
    S.team={name:tr.data.name,code:tr.data.join_code,owner:tr.data.owner,players:d.players||[],drills:d.drills||[],score:d.score||{a:{n:'Lag Grön',p:0},b:{n:'Lag Gul',p:0}},sessions:sr.data.map(r=>r.data)};
    lastTeam=JSON.stringify({n:S.team.name,b:teamBlob(S.team)});lastTS={};S.team.sessions.forEach(s=>lastTS[s.id]=JSON.stringify(s));
    lsSave();if(!busyUI()&&(tab==='lag'||tab==='hist'||tab==='idag'))render();
  }catch(e){console.warn(e)}
}
async function loadTeams(){const r=await sb.from('teams').select('id,name,join_code,owner,created_at').order('created_at');if(r.error)throw r.error;TEAMS=r.data||[];return TEAMS}
async function afterLogin(user){
  ME=user;hideAuth();lsSet('jk.last',{id:user.id,email:user.email});PROF=PROF||lsGet(UK('prof'),null);showWho();
  const cS=lsGet(UK('state'),null),cH=lsGet(UK('sessions'),null),cs=lsGet(UK('sync'),{});
  PEND=lsGet(UK('pend'),{w:[],wd:[]});lastState=cs.lastState||'';lastTeam=cs.lastTeam||'';lastTS=cs.lastTS||{};TID=cs.TID||null;
  const legacy=!cS?{S:lsGet('lyft.state',null),H:lsGet('lyft.sessions',[])}:null;
  if(cS&&Array.isArray(cS.plan)){S=cS;H=cH||[]}
  render();if(!sb||navigator.onLine===false){setSync('off');return}
  setSync('wait');
  try{
    const [pr,sr,wr]=await Promise.all([sb.from('profiles').select('id,email,name,role').eq('id',ME.id).maybeSingle(),sb.from('user_state').select('data').eq('user_id',ME.id).maybeSingle(),sb.from('workouts').select('id,data').eq('user_id',ME.id).order('date',{ascending:false}).limit(5000)]);
    ck(pr);ck(sr);ck(wr);PROF=pr.data||{role:'client',email:ME.email,name:(ME.email||'').split('@')[0]};lsSet(UK('prof'),PROF);showWho();
    const team=S.team;
    if(sr.data&&sr.data.data&&Array.isArray(sr.data.data.plan)){const la=S.active;S=Object.assign(defState(),sr.data.data);if(!S.active&&la&&PEND.w.length)S.active=la;lastState=JSON.stringify(stateOut())}
    else if(legacy&&legacy.S&&Array.isArray(legacy.S.plan)){S=Object.assign(defState(),legacy.S);if(legacy.S.team)S._legacyTeam=legacy.S.team;lastState=''}
    S.team=team||null;
    const remote=wr.data.map(r=>r.data),ids=new Set(remote.map(x=>x.id));
    let localOnly=H.filter(s=>PEND.w.includes(s.id)&&!ids.has(s.id));
    if(!remote.length&&legacy&&legacy.H&&legacy.H.length){localOnly=legacy.H;legacy.H.forEach(s=>{if(!PEND.w.includes(s.id))PEND.w.push(s.id)})}
    H=remote.filter(s=>!PEND.wd.includes(s.id)).concat(localOnly).sort((a,b)=>b.date.localeCompare(a.date));
    await loadTeams();
    if(!TEAMS.some(t=>t.id===TID))TID=S.teamId&&TEAMS.some(t=>t.id===S.teamId)?S.teamId:(TEAMS[0]?TEAMS[0].id:null);
    if(!TID){S.team=null;lastTS={};lastTeam=''}
    lsSave();render();
    if(TID)await teamPull(true);
    await flush();
    if(syncK==='wait')setSync('ok');
  }catch(e){console.warn(e);setSync(navigator.onLine===false?'off':'err')}
}

async function boot(){
  if(!window.supabase||!window.supabase.createClient){const last=lsGet('jk.last',null);if(last&&last.id){ME={id:last.id,email:last.email};const cS=lsGet(UK('state'),null);if(cS){S=cS;H=lsGet(UK('sessions'),[]);S.team=S.team||null}PEND=lsGet(UK('pend'),{w:[],wd:[]});render();setSync('off')}else showAuth('login','Kan inte nå servern. Kontrollera nätet och ladda om sidan.');return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){recovering=true;showAuth('recover')}});
  const {data}=await sb.auth.getSession();
  if(recovering){showAuth('recover');return}
  if(data&&data.session)afterLogin(data.session.user);else showAuth('login');
}

function bell(pl){
  const n=Math.min(pl.length,7);let p='';
  const plate=(x,col)=>`<rect x="${x}" y="14" width="15" height="102" rx="3" fill="${col}"/><rect x="${x+2}" y="18" width="3" height="94" rx="1.5" fill="#fff" opacity=".28"/><rect x="${x+11}" y="18" width="2" height="94" fill="#000" opacity=".18"/>`;
  for(let i=0;i<n;i++){p+=plate(128-i*17,pl[i])+plate(217+i*17,pl[i])}
  if(!n)p=`<rect x="128" y="14" width="15" height="102" rx="3" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4"/><rect x="217" y="14" width="15" height="102" rx="3" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="5 4"/>`;
  return `<svg class="bell" viewBox="0 0 360 130" role="img" aria-label="${pl.length} pass denna vecka"><ellipse cx="180" cy="124" rx="150" ry="4" fill="var(--ink)" opacity=".08"/><rect x="4" y="60" width="352" height="10" rx="5" fill="var(--steel)"/><rect x="146" y="57" width="68" height="16" rx="3" fill="var(--steel)"/><rect x="152" y="60" width="56" height="10" fill="#000" opacity=".12"/><rect x="144" y="50" width="6" height="30" rx="2" fill="var(--ink)" opacity=".7"/><rect x="210" y="50" width="6" height="30" rx="2" fill="var(--ink)" opacity=".7"/>${p}</svg>`;
}

function activeView(){

  calnav:b=>{calM=new Date(calM.getFullYear(),calM.getMonth()+(+b.dataset.v),1);render()},
  logpick:b=>{LG.ex=b.dataset.ex;openLog()},
  logmin:b=>{LG.min=+b.dataset.v;openLog()},
  logday:b=>{LG.day=+b.dataset.v;openLog()},
  lognew:()=>{const n=LG.q.trim();if(!n)return;S.custom=S.custom||[];const c={id:'c'+Date.now().toString(36),n:n[0].toUpperCase()+n.slice(1),t:'sp',g:'Sport'};S.custom.push(c);LG.ex=c.id;LG.q='';save();openLog()},
  savelog:()=>{const e=EX(LG.ex),m=Math.round(num(LG.min));if(!LG.ex)return;if(!(m>0&&m<=1440)){toast('Skriv antal minuter');return}
    let end=new Date();if(LG.date){end=dday(LG.date);end.setHours(18,0,0,0)}else{end.setDate(end.getDate()-LG.day);if(LG.day)end.setHours(18,0,0,0)}const st=new Date(end.getTime()-m*60000);
    const set={a:m};if(e.t==='c'&&num(LG.km)>0)set.b=Math.round(num(LG.km)*100)/100;
    const sess={id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),date:st.toISOString(),day:wd(st),name:e.n,dur:m,items:[{ex:e.id,sets:[set],ln:false}]};
    H.push(sess);H.sort((a,b)=>b.date.localeCompare(a.date));closeSheet();save();putSession(sess);render();toast(`${e.n}, ${m} min sparat`)},
  addbw:()=>{const kg=num($('#bwIn').value);if(!(kg>=25&&kg<=350)){toast('Skriv vikten i kg, t.ex. 78,5');return}const d=isoDay(Date.now());S.bw=(S.bw||[]).filter(x=>x.d!==d);S.bw.push({d,kg:Math.round(kg*10)/10});save();render();toast('Vikten är sparad')},
  setgoal:()=>{const v=$('#bwGoal').value.trim(),kg=num(v);if(v&&!(kg>=25&&kg<=350)){toast('Skriv målet i kg');return}S.bwGoal=v?Math.round(kg*10)/10:null;save();render();toast(v?'Målet är satt':'Målet är borttaget')},
  delbw:b=>{S.bw=(S.bw||[]).filter(x=>x.d!==b.dataset.d);save();render()},
  addcustom:()=>{const n=$('#cn').value.trim();if(!n){toast('Skriv ett namn');return}S.custom=S.custom||[];S.custom.push({id:'c'+Date.now().toString(36),n,t:$('#ct').value,g:$('#cg').value});save();render();toast(n+' skapad')},
  delcustom:b=>ask('Ta bort övning','Övningen tas bort ur listan. Sparade pass påverkas inte.','Ta bort',()=>{S.custom=S.custom.filter(c=>c.id!==b.dataset.id);S.plan=S.plan.map(p=>p.filter(x=>x!==b.dataset.id));save();render()}),
  export:async()=>{const txt=JSON.stringify({app:'lyft',state:S,sessions:H});try{await navigator.clipboard.writeText(txt);toast('Kopierat')}catch(e){const t=$('#bk');t.value=txt;t.select();toast('Markera och kopiera texten')}},
  import:()=>{let d;try{d=JSON.parse($('#bk').value)}catch(e){toast('Texten kunde inte läsas');return}if(!d||d.app!=='lyft'||!d.state||!Array.isArray(d.sessions)){toast('Det ser inte ut som en säkerhetskopia');return}
    ask('Importera','Schema och egna övningar ersätts. Pass läggs till i historiken.','Importera',async()=>{const keepT=S.team;S=Object.assign(defState(),d.state);if(S.team&&!keepT)S._legacyTeam=S.team;S.team=keepT;const ids=new Set(H.map(s=>s.id)),add=d.sessions.filter(s=>s&&s.id&&!ids.has(s.id));H=H.concat(add).sort((a,b)=>b.date.localeCompare(a.date));save();render();toast(add.length+' pass importerade');for(const s of add)await putSession(s)})},
  close:()=>closeSheet(),
  ok:()=>{const cb=sheetCb;closeSheet();cb&&cb()},
  pick:b=>{const cb=sheetCb;closeSheet();cb&&cb(b.dataset.ex)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f)f(b,+b.dataset.i,+b.dataset.j)});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f&&S.active){const s=S.active.items[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.f]=t.value.replace(',','.');save()}
  else if(t.dataset.name!==undefined){S.names[+t.dataset.name]=t.value;save()}
  else if(t.id==='exq'){exQ=t.value;$('#exlist').innerHTML=exList()}
  else if(t.id==='pq')fillPick(t.value);
  else if(t.id==='aq'){LG.q=t.value;fillLogList()}
  else if(t.id==='amin')LG.min=t.value;
  else if(t.id==='akm')LG.km=t.value});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='impf'){const f=t.files&&t.files[0];t.value='';if(f)readImport(f);return}
  if(t.dataset.im!==undefined&&IMP){IMAP[IMP.names[+t.dataset.im]]=t.value;return}
  if(t.dataset.p&&progCtx){const ex=progCtx.ex,P=prog(ex),k=t.dataset.p;
    if(k==='r')P.r=t.value;else{const v=num(t.value);if(v>0)P[k]=k==='inc'?q4(v):Math.round(v)}
    if(P.lo>P.hi)[P.lo,P.hi]=[P.hi,P.lo];
    S.prog=S.prog||{};S.prog[ex]=P;
    if(S.active)S.active.items.forEach((it,i)=>{if(it.ex===ex&&!it.sets.some(s=>s.done))S.active.items[i]=newItem(ex)});
    save();const i=progCtx.i;openProg(ex,i);render();return}
  if(t.dataset.name!==undefined)render();else if(e.target.id==='statEx'){statEx=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
render();setSync('wait');
boot();
}
</script>
</body>
</html>
